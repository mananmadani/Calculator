<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculator</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f5d62">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Calculator">
<style>
:root {
  color-scheme: light;
  --bg: #dde5da;
  --body: #eef1e9;
  --screen: #1f2d2b;
  --screen-text: #e8f3e4;
  --screen-dim: #8aa39b;
  --key: #fbfbf6;
  --key-text: #1f2d2b;
  --key-shadow: #b9c4b6;
  --op: #2f5d62;
  --op-text: #f2faf7;
  --op-shadow: #1d3c40;
  --eq: #e3a72f;
  --eq-text: #2a1d00;
  --eq-shadow: #a97817;
  --fn: #c9d3c5;
  --fn-shadow: #a3b0a0;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121a19;
    --body: #1a2523;
    --screen: #0c1211;
    --screen-text: #e8f3e4;
    --screen-dim: #6f8a82;
    --key: #2a3836;
    --key-text: #eef4ee;
    --key-shadow: #0f1716;
    --op: #3f7c82;
    --op-text: #f2faf7;
    --op-shadow: #25494d;
    --eq: #e3a72f;
    --eq-text: #2a1d00;
    --eq-shadow: #8a6212;
    --fn: #3a4a47;
    --fn-shadow: #172120;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121a19; --body: #1a2523; --screen: #0c1211; --screen-text: #e8f3e4; --screen-dim: #6f8a82;
  --key: #2a3836; --key-text: #eef4ee; --key-shadow: #0f1716;
  --op: #3f7c82; --op-text: #f2faf7; --op-shadow: #25494d;
  --eq: #e3a72f; --eq-text: #2a1d00; --eq-shadow: #8a6212;
  --fn: #3a4a47; --fn-shadow: #172120;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
html, body { height: 100%; margin: 0; overscroll-behavior: none; }
body {
  background: var(--bg);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  display: flex; padding: 16px;
  overflow-x: hidden; overflow-y: auto;
  -webkit-user-select: none; user-select: none; touch-action: manipulation;
}
.calc {
  margin: auto; width: 100%; max-width: 420px;
  height: 100%; max-height: 780px; min-height: 520px;
  display: flex; flex-direction: column; gap: 12px;
  background: var(--body); border-radius: 28px; padding: 14px;
  box-shadow: 0 2px 0 var(--key-shadow), 0 18px 40px rgba(20, 40, 35, .18);
}
.screen {
  flex: 1.15 1 0; min-height: 130px;
  background: var(--screen); border-radius: 18px; padding: 10px 16px 12px;
  display: flex; flex-direction: column; gap: 4px; overflow: hidden;
}
.expr {
  flex: 1 1 0; min-height: 0; position: relative;
  display: flex; flex-direction: column; overflow-y: auto;
  color: var(--screen-text); font-size: 2rem; font-weight: 500; line-height: 1.4;
  text-align: right; word-break: break-all; cursor: text;
  font-variant-numeric: tabular-nums; scrollbar-width: none;
}
.expr::-webkit-scrollbar { display: none; }
.line { margin-top: auto; }
.c { padding: 0 .05em; }
.c.o { color: var(--eq); padding: 0 .14em; }
.ph { color: var(--screen-dim); }
.caret {
  display: inline-block; width: 2px; height: 1.1em; margin: 0 1px;
  background: var(--eq); vertical-align: text-bottom; animation: blink 1s steps(1) infinite;
}
@keyframes blink { 50% { opacity: 0; } }
.result {
  color: var(--screen-dim); font-size: 1.35rem; min-height: 1.5em; line-height: 1.5;
  text-align: right; white-space: nowrap; overflow: hidden;
  font-variant-numeric: tabular-nums;
}
.result.bad { color: #ff9d8a; }
.screen.done .expr { flex: 0 0 auto; max-height: 40%; font-size: 1.2rem; color: var(--screen-dim); }
.screen.done .result { color: var(--screen-text); font-size: 3.2rem; font-weight: 600; line-height: 1.15; }
.keys {
  flex: 3 1 0; min-height: 0; display: grid; gap: 10px;
  grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(6, 1fr);
}
button {
  font: inherit; font-size: clamp(1.3rem, 6vw, 1.75rem); font-weight: 500;
  width: 100%; height: 100%; min-height: 0; padding: 0;
  border: 0; border-radius: 16px; cursor: pointer;
  background: var(--key); color: var(--key-text);
  box-shadow: 0 4px 0 var(--key-shadow);
  display: flex; align-items: center; justify-content: center;
  transition: transform .08s, box-shadow .08s; touch-action: manipulation;
}
button svg { width: 1.5em; height: 1.5em; fill: none; stroke: currentColor; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; }
button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--key-shadow); }
button:focus-visible { outline: 3px solid var(--eq); outline-offset: 2px; }
button.fn { background: var(--fn); box-shadow: 0 4px 0 var(--fn-shadow); }
button.fn:active { box-shadow: 0 1px 0 var(--fn-shadow); }
button.op { background: var(--op); color: var(--op-text); box-shadow: 0 4px 0 var(--op-shadow); }
button.op:active { box-shadow: 0 1px 0 var(--op-shadow); }
button.eq { background: var(--eq); color: var(--eq-text); box-shadow: 0 4px 0 var(--eq-shadow); }
button.eq:active { box-shadow: 0 1px 0 var(--eq-shadow); }
.zero { grid-column: span 2; }
@media (max-width: 520px) {
  body { padding: 0; }
  .calc { max-width: none; max-height: none; border-radius: 0; box-shadow: none; padding: 12px 12px 16px; }
}
@media (max-height: 560px) and (orientation: landscape) {
  .calc { flex-direction: row; min-height: 0; max-width: none; }
  .screen { flex: 1 1 0; }
  .keys { flex: 1.5 1 0; }
  .expr { font-size: 1.5rem; }
}
@media (prefers-reduced-motion: reduce) { button { transition: none; } .caret { animation: none; } }
</style>
</head>
<body>
<main class="calc" aria-label="Calculator">
  <div class="screen" id="screen">
    <div class="expr" id="expr" aria-label="Expression. Tap to move the cursor."></div>
    <div class="result" id="result" aria-live="polite"></div>
  </div>
  <div class="keys">
    <button class="fn" data-k="clear" aria-label="Clear all">AC</button>
    <button class="fn" data-k="back" aria-label="Delete"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 5H9l-6 7 6 7h12z"/><path d="M12 9.5l5 5M17 9.5l-5 5"/></svg></button>
    <button class="fn" data-k="left" aria-label="Move cursor left"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="fn" data-k="right" aria-label="Move cursor right"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
    <button class="fn" data-k="(" aria-label="Open bracket">(</button>
    <button class="fn" data-k=")" aria-label="Close bracket">)</button>
    <button class="fn" data-k="%" aria-label="Percent">%</button>
    <button class="op" data-k="÷" aria-label="Divide">÷</button>
    <button data-k="7">7</button>
    <button data-k="8">8</button>
    <button data-k="9">9</button>
    <button class="op" data-k="×" aria-label="Multiply">×</button>
    <button data-k="4">4</button>
    <button data-k="5">5</button>
    <button data-k="6">6</button>
    <button class="op" data-k="−" aria-label="Subtract">−</button>
    <button data-k="1">1</button>
    <button data-k="2">2</button>
    <button data-k="3">3</button>
    <button class="op" data-k="+" aria-label="Add">+</button>
    <button class="zero" data-k="0">0</button>
    <button data-k=".">.</button>
    <button class="eq" data-k="=" aria-label="Equals">=</button>
  </div>
</main>
<script>
(function () {
  var chars = [], cur = 0, done = false, resultRaw = "", flash = "";
  var screenEl = document.getElementById("screen");
  var exprEl = document.getElementById("expr");
  var resEl = document.getElementById("result");
  var OPS = "+−×÷";
  function isDigit(c) { return c !== undefined && c >= "0" && c <= "9"; }
  function isOp(c) { return c !== undefined && OPS.indexOf(c) !== -1; }
  function endsValue(c) { return isDigit(c) || c === ")" || c === "%"; }

  // ---- Evaluator (no eval): + − × ÷ % ( ) and unary minus ----
  function evaluate(list) {
    var s = list.join(""), open = 0, i = 0, n;
    for (n = 0; n < list.length; n++) {
      if (list[n] === "(") open++;
      if (list[n] === ")") { open--; if (open < 0) return { err: "Check brackets" }; }
    }
    if (!s) return { err: "" };
    s += new Array(open + 1).join(")");
    function peek() { return s.charAt(i); }
    function fail(m) { throw new Error(m); }
    function number() {
      var st = i;
      while (isDigit(peek()) || peek() === ".") i++;
      var t = s.slice(st, i), v = parseFloat(t);
      if (!t || isNaN(v)) fail("Incomplete expression");
      return v;
    }
    function primary() {
      if (peek() === "(") { i++; var r = add(); if (peek() !== ")") fail("Check brackets"); i++; return { v: r.v, p: false }; }
      return { v: number(), p: false };
    }
    function postfix() { var r = primary(); while (peek() === "%") { i++; r = { v: r.v / 100, p: true }; } return r; }
    function unary() {
      if (peek() === "−") { i++; var r = unary(); return { v: -r.v, p: r.p }; }
      if (peek() === "+") { i++; return unary(); }
      return postfix();
    }
    function term() {
      var r = unary();
      while (peek() === "×" || peek() === "÷") {
        var o = peek(); i++;
        var b = unary();
        if (o === "×") r = { v: r.v * b.v, p: false };
        else { if (b.v === 0) fail("Can’t divide by zero"); r = { v: r.v / b.v, p: false }; }
      }
      return r;
    }
    function add() {
      var r = term();
      while (peek() === "+" || peek() === "−") {
        var o = peek(); i++;
        var b = term();
        var bv = b.p ? r.v * b.v : b.v; // 200 + 10% = 220
        r = { v: o === "+" ? r.v + bv : r.v - bv, p: false };
      }
      return r;
    }
    try {
      var out = add();
      if (i < s.length) fail("Check expression");
      if (!isFinite(out.v)) fail("Result too large");
      return { v: out.v };
    } catch (e) { return { err: e.message }; }
  }
  function clean(n) { return String(parseFloat(n.toPrecision(12))); }
  function fmt(t) {
    var neg = t.charAt(0) === "-";
    if (neg) t = t.slice(1);
    if (/e/i.test(t)) return (neg ? "−" : "") + t;
    var p = t.split(".");
    return (neg ? "−" : "") + p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",") + (p.length > 1 ? "." + p[1] : "");
  }

  // ---- Editing at the cursor ----
  function ins(str) { for (var j = 0; j < str.length; j++) { chars.splice(cur, 0, str.charAt(j)); cur++; } }
  function typeDigit(d) {
    var p = chars[cur - 1];
    if (p === ")" || p === "%") ins("×");
    else if (p === "0" && !isDigit(chars[cur - 2]) && chars[cur - 2] !== "." && chars[cur] !== ".") { chars.splice(cur - 1, 1); cur--; }
    ins(d);
  }
  function typeDot() {
    var l = cur, r = cur;
    while (l > 0 && (isDigit(chars[l - 1]) || chars[l - 1] === ".")) l--;
    while (r < chars.length && (isDigit(chars[r]) || chars[r] === ".")) r++;
    if (chars.slice(l, r).indexOf(".") !== -1) return;
    if (chars[cur - 1] === ")" || chars[cur - 1] === "%") ins("×");
    if (!isDigit(chars[cur - 1])) ins("0");
    ins(".");
  }
  function typeOp(o) {
    var p = chars[cur - 1];
    if (isOp(p)) {
      if (o === "−" && (p === "×" || p === "÷")) { ins(o); return; }
      while (isOp(chars[cur - 1])) { chars.splice(cur - 1, 1); cur--; }
    }
    if (cur === 0 || chars[cur - 1] === "(") { if (o === "−" || o === "+") ins(o); return; }
    ins(o);
  }
  function typeParen(c) {
    var p = chars[cur - 1];
    if (c === "(") { if (endsValue(p)) ins("×"); ins("("); return; }
    var open = 0, j;
    for (j = 0; j < cur; j++) { if (chars[j] === "(") open++; else if (chars[j] === ")") open--; }
    if (open > 0 && endsValue(p)) ins(")");
  }

  function press(k) {
    flash = "";
    if (k === "clear") { chars = []; cur = 0; done = false; render(); return; }
    if (done) {
      if (k === "back" || k === "left" || k === "right") { done = false; cur = chars.length; }
      else if (k === "=" || k === ")") return;
      else if (isOp(k) || k === "%") {
        chars = /e/i.test(resultRaw) ? [] : resultRaw.replace("-", "−").split("");
        cur = chars.length; done = false;
      } else { chars = []; cur = 0; done = false; }
    }
    if (/^\d$/.test(k)) typeDigit(k);
    else if (k === ".") typeDot();
    else if (isOp(k)) typeOp(k);
    else if (k === "(" || k === ")") typeParen(k);
    else if (k === "%") { if (endsValue(chars[cur - 1])) ins("%"); }
    else if (k === "back") { if (cur > 0) { chars.splice(cur - 1, 1); cur--; } }
    else if (k === "left") { if (cur > 0) cur--; }
    else if (k === "right") { if (cur < chars.length) cur++; }
    else if (k === "=") {
      var r = evaluate(chars);
      if (r.err === undefined) { resultRaw = clean(r.v); done = true; }
      else if (chars.length) { flash = r.err; buzz([30, 40, 30]); }
    }
    render();
  }

  function render() {
    var h = "", i;
    for (i = 0; i <= chars.length; i++) {
      if (i === cur && !done) h += '<span class="caret"></span>';
      if (i < chars.length) h += '<span class="c' + (isOp(chars[i]) ? " o" : "") + '" data-i="' + i + '">' + chars[i] + "</span>";
    }
    if (!chars.length && !done) h += '<span class="ph">0</span>';
    exprEl.innerHTML = '<div class="line">' + h + "</div>";
    screenEl.classList.toggle("done", done);
    resEl.classList.toggle("bad", !!flash);
    resEl.style.fontSize = "";
    if (done) {
      resEl.textContent = fmt(resultRaw);
      var size = window.innerHeight < 560 ? 36 : 52;
      resEl.style.fontSize = size + "px";
      while (resEl.scrollWidth > resEl.clientWidth && size > 20) { size -= 2; resEl.style.fontSize = size + "px"; }
    } else if (flash) {
      resEl.textContent = flash;
    } else {
      var t = chars.join(""), r = chars.length ? evaluate(chars) : { err: "" };
      resEl.textContent = (r.err === undefined && /[+×÷%()]|.−/.test(t)) ? "= " + fmt(clean(r.v)) : "";
    }
    var c = exprEl.querySelector(".caret");
    if (c) {
      var top = c.offsetTop, bottom = top + c.offsetHeight;
      if (top < exprEl.scrollTop) exprEl.scrollTop = top;
      else if (bottom > exprEl.scrollTop + exprEl.clientHeight) exprEl.scrollTop = bottom - exprEl.clientHeight;
    }
  }

  // ---- Haptics: Android = Vibration API; iPhone (Safari 17.4+) = hidden switch input ----
  var canVibrate = typeof navigator.vibrate === "function";
  var sw = document.createElement("label");
  sw.setAttribute("aria-hidden", "true");
  sw.style.cssText = "position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0;pointer-events:none";
  var swInput = document.createElement("input");
  swInput.type = "checkbox"; swInput.setAttribute("switch", ""); swInput.tabIndex = -1;
  sw.appendChild(swInput); document.body.appendChild(sw);
  function buzz(p) { try { if (canVibrate) navigator.vibrate(p); else sw.click(); } catch (e) {} }
  function strength(k) { return k === "=" ? 22 : k === "clear" ? 16 : /^[\d.]$/.test(k) ? 8 : 12; }

  // ---- Keys (hold ⌫ and arrows to repeat) ----
  var keys = document.querySelector(".keys");
  var rep = { timer: null, iv: null, fired: false };
  function stopRep() { clearTimeout(rep.timer); clearInterval(rep.iv); }
  keys.addEventListener("pointerdown", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    var k = b.dataset.k;
    rep.fired = false; stopRep();
    if (canVibrate) buzz(strength(k));
    if (k === "back" || k === "left" || k === "right") {
      rep.timer = setTimeout(function () {
        rep.fired = true; press(k);
        rep.iv = setInterval(function () { press(k); buzz(canVibrate ? 6 : 1); }, 80);
      }, 400);
    }
  });
  document.addEventListener("pointerup", stopRep);
  document.addEventListener("pointercancel", stopRep);
  keys.addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    if (rep.fired) { rep.fired = false; return; }
    if (!canVibrate) buzz(1);
    press(b.dataset.k);
  });

  // ---- Tap the expression to place the cursor ----
  exprEl.addEventListener("click", function (e) {
    var t = e.target.closest("[data-i]");
    flash = "";
    if (done) { done = false; }
    if (t) {
      var i = +t.dataset.i, r = t.getBoundingClientRect();
      cur = e.clientX < r.left + r.width / 2 ? i : i + 1;
    } else cur = chars.length;
    buzz(canVibrate ? 6 : 1);
    render();
  });

  var map = { "+": "+", "-": "−", "*": "×", "/": "÷", "x": "×", "X": "×", "Enter": "=", "=": "=", "Backspace": "back", "Escape": "clear", "%": "%", "(": "(", ")": ")", ".": ".", ",": ".", "ArrowLeft": "left", "ArrowRight": "right" };
  document.addEventListener("keydown", function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var k = /^\d$/.test(e.key) ? e.key : map[e.key];
    if (k) { e.preventDefault(); press(k); }
  });
  window.addEventListener("resize", render);
  render();
})();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>
</body>
</html>
